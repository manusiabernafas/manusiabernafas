<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" width="100%" height="100%">
  <defs>
    <!-- Gradasi Background: Pink Muda Pastel ke Biru Muda -->
    <linearGradient id="pastelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1" /> <!-- Pink Muda Pastel -->
      <stop offset="50%" stop-color="#ffd1dc" /> <!-- Transisi Light Pink -->
      <stop offset="100%" stop-color="#b0e0e6" /> <!-- Biru Muda -->
    </linearGradient>

    <!-- Efek Bayangan Teks -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Latar Belakang dengan Sudut Melengkung -->
  <rect width="950" height="650" rx="25" ry="25" fill="url(#pastelGrad)" />

  <!-- Elemen Dekoratif Background -->
  <circle cx="120" cy="100" r="140" fill="#ffffff" opacity="0.15" />
  <circle cx="830" cy="550" r="160" fill="#ffffff" opacity="0.15" />

  <!-- Tulisan di Atas (Tengah): "Founder + CTO" -->
  <text x="475" y="100" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" filter="url(#shadow)" letter-spacing="2">
    FOUNDER + CTO
  </text>

  <!-- Foto Kiri: Lvara -->
  

  <!-- Foto Kanan: Awshop -->
  
</svg>
