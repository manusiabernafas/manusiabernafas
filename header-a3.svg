<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="100%">
  <defs>
    <!-- Gradasi Background -->
    <linearGradient id="pastelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1" />
      <stop offset="50%" stop-color="#ffd1dc" />
      <stop offset="100%" stop-color="#b0e0e6" />
    </linearGradient>

    <!-- Efek Bayangan Teks -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="130" rx="14" ry="14" fill="url(#pastelGrad)" />

  <circle cx="70" cy="30" r="40" fill="#ffffff" opacity="0.15" />
  <circle cx="730" cy="100" r="50" fill="#ffffff" opacity="0.15" />

  <!-- Teks Utama (Tanpa Simbol Dan) -->
  <text x="400" y="52" font-family="Impact, &#39;Arial Black&#39;, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow)" letter-spacing="2">
    ⚡ FOUNDER + CTO | BUILDER + TECH ENTHUSIAST ⚡
  </text>

  <!-- Teks Kedua (Tanpa Simbol Dan) -->
  <text x="400" y="82" font-family="&#39;Trebuchet MS&#39;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.95" letter-spacing="0.8">
    Exploring AI Agents, Web3, Data Analysis and Digital Solutions
  </text>
</svg>
